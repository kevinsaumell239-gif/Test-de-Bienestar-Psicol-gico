name: Flutter Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Crear estructura nativa de Flutter
        run: |
          flutter create --platforms android .

      # 🔴 ESTE PASO ASEGURA QUE EL PERMISO DE INTERNET ESTÉ EN ANDROIDMANIFEST.XML
      - name: Asegurar permiso de Internet en Android
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if grep -q "android.permission.INTERNET" "$MANIFEST_PATH"; then
            echo "El permiso de Internet ya existe."
          else
            echo "Inyectando permiso de Internet..."
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST_PATH"
          fi

      - name: Instalar dependencias
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: ebes-jc-apk
          path: build/app/outputs/flutter-apk/app-release.apk
